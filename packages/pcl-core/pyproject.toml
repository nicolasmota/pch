[project]
name = "pcl-core"
version = "0.2.0"
description = "Personal Context Layer trust kernel: vault, policy, memory, retrieval, audit"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "sqlcipher3>=0.6.2",
    "cryptography>=44.0",
    "keyring>=25.0",
    "python-ulid>=2.2",
    "argon2-cffi>=23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcl_core"]
