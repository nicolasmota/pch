[project]
name = "pcl-server"
version = "0.1.0"
description = "Local PCL service: FastAPI control plane and MCP server"
requires-python = ">=3.14"
dependencies = [
    "pcl-core",
    "pca",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "watchfiles>=1.0",
    "mcp>=1.9",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "google-auth>=2.36",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
pcl-server = "pcl_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcl_server"]

[tool.uv.sources]
pcl-core = { workspace = true }
pca = { workspace = true }
