[project]
name = "pcl-server"
version = "0.2.0"
description = "Local PCL service: FastAPI control plane and MCP server"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
        "pcl-core==0.2.0",
        "pcl-pca==0.2.0",
        "pcl-sdk==0.2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "watchfiles>=1.0",
    "mcp>=1.9",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "google-auth>=2.36",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
pcl-server = "pcl_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/pcl_server"]
artifacts = ["src/pcl_server/static/**"]

[tool.uv.sources]
pcl-core = { workspace = true }
pcl-pca = { workspace = true }
pcl-sdk = { workspace = true }
