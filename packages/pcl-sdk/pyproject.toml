[project]
name = "pcl-sdk"
version = "0.1.0"
description = "Python SDK and demo agent for Personal Context Hub"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "mcp>=1.9",
    "pydantic>=2.10",
]

[project.scripts]
pcl-sdk = "pcl_sdk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcl_sdk"]
