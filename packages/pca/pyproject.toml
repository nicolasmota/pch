[project]
name = "pcl-pca"
version = "0.2.0"
description = "Portable Context Archive v0 export/import"
requires-python = ">=3.14"
dependencies = [
    "pcl-core==0.2.0",
    "pyrage>=1.2",
    "pydantic>=2.10",
]

[project.scripts]
pca = "pca.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pca"]

[tool.uv.sources]
pcl-core = { workspace = true }
