name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build UI
        working-directory: frontend
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@v4
      - name: Build wheels
        run: uv build --all-packages
      - name: Release gate
        run: uv run python scripts/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  matrix:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v4
      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Install from dist
        shell: bash
        run: uv tool install --find-links dist "personal-context-hub==${{ steps.ver.outputs.version }}"
      - name: Doctor
        shell: bash
        run: |
          pch doctor --json | tee doctor.json
          python - <<'PY'
          import json
          report = json.load(open("doctor.json"))
          assert report["encrypted"] is True
          assert report["ui_bundled"] is True
          print("native_window", report.get("native_window"))
          PY
      - name: Offline smoke
        shell: bash
        run: |
          UV_OFFLINE=1 pch smoke --data-dir "${RUNNER_TEMP}/pch-smoke"
      - name: Uninstall keeps data
        shell: bash
        run: |
          data="${RUNNER_TEMP}/pch-keep"
          mkdir -p "$data"
          echo stay > "$data/marker"
          pch uninstall --yes --data-dir "$data" || true
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            python - <<'PY'
          import shutil, time, os
          deadline = time.time() + 30
          while time.time() < deadline:
              if shutil.which("pch") is None:
                  break
              time.sleep(1)
          PY
          fi
          test -e "$data/marker"

  publish:
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v4
      - name: Publish
        run: uv publish
