[project]
name = "hub-desktop"
version = "0.1.0"
description = "Personal Context Hub desktop shell"
requires-python = ">=3.14"
dependencies = [
    "pcl-server",
    "pywebview>=5.4",
]

[project.scripts]
hub-desktop = "hub_desktop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub_desktop"]

[tool.uv.sources]
pcl-server = { workspace = true }
