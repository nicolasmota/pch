[project]
name = "personal-context-hub"
version = "0.2.0"
description = "Personal Context Hub desktop shell"
requires-python = ">=3.14"
dependencies = [
    "pcl-server==0.2.0",
    "pywebview>=5.4",
]

[project.scripts]
personal-context-hub = "hub_desktop.cli:main"
pch = "hub_desktop.cli:main"
hub-desktop = "hub_desktop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub_desktop"]

[tool.uv.sources]
pcl-server = { workspace = true }
