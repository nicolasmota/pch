[plugin]
id = "pcl.example-rss"
name = "Example RSS"
description = "Imports items from an RSS/Atom feed as artifacts."
version = "0.1.0"
publisher = "example-dev"
api_version = 1
entry = "sync:main"

[permissions]
secrets = false
schedule = "60m"
hosts = ["feeds.bbci.co.uk", "example.com"]

[[permissions.produces]]
type = "artifact"
classification = "personal"
