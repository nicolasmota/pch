[plugin]
id = "pcl.gmail"
name = "Gmail"
description = "Imports selected Gmail messages into the Hub as sensitive artifacts."
version = "1.0.0"
publisher = "pcl-first-party"
api_version = 1
entry = "sync:main"

[permissions]
secrets = true
schedule = "60m"
hosts = [
  "gmail.googleapis.com",
  "oauth2.googleapis.com",
  "accounts.google.com",
  "www.googleapis.com",
]

[[permissions.produces]]
type = "artifact"
kind = "email"
classification = "sensitive"
