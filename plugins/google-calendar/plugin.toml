[plugin]
id = "pcl.google-calendar"
name = "Google Calendar"
description = "Imports your calendar events into the Hub."
version = "1.0.0"
publisher = "pcl-first-party"
api_version = 1
entry = "sync:main"

[permissions]
secrets = true
schedule = "15m"
hosts = [
  "www.googleapis.com",
  "oauth2.googleapis.com",
  "accounts.google.com",
]

[[permissions.produces]]
type = "event"
classification = "private"
